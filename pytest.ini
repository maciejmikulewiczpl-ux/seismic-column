[pytest]
# The integration tests drive real p-y and moment-curvature analyses, so the
# full suite takes ~20 minutes.  Anything that runs a whole batch (especially an
# optimise run, and doubly so through the silo/balance outer loop) is marked
# `slow`, leaving a ~2 minute loop for development:
#
#     .venv\Scripts\python.exe -m pytest -q -m "not slow"     # fast loop
#     .venv\Scripts\python.exe -m pytest -q                   # everything
#
# Nothing is skipped by default — `slow` only exists so it can be deselected.
markers =
    slow: runs a full batch analysis (seconds to minutes); deselect with -m "not slow"
